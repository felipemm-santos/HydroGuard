# Docker Compose - HydroGuard
# Orquestra API + SQL Server para execução completa do sistema

version: '3.8'

services:
  # ===== SQL Server =====
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hydroguard-sql
    environment:
      # Senha do administrador SQL Server
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=HydroGuard@2026
    ports:
      # Porta 1433 exposta para acesso externo (opcional)
      - "1433:1433"
    volumes:
      # Persistência dos dados do banco
      - sqlserver_data:/var/opt/mssql
    networks:
      - hydroguard-net
  # Healthcheck para garantir que SQL está pronto antes da API
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "HydroGuard@2026" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===== API HydroGuard =====
  api:
    build:
      context: .
      dockerfile: HydroGuard.API/Dockerfile
    container_name: hydroguard-api
    ports:
      # API disponível em http://localhost:5000
      - "5000:8080"
    environment:
      # Connection string apontando ao container SQL Server
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HydroGuardDB;User Id=sa;Password=HydroGuard@2026;TrustServerCertificate=True;
      - Jwt__Key=HydroGuardSecretKey2026FIAP!SuperSecure
      - Jwt__Issuer=HydroGuard
      - Jwt__Audience=HydroGuardUsers
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - hydroguard-net

# ===== Volumes =====
volumes:
  sqlserver_data:

# ===== Rede =====
networks:
  hydroguard-net:
    driver: bridge
